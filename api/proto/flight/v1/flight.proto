syntax = "proto3";

package flight.v1;

option go_package = "flightbooking/internal/flightv1;flightv1";

import "google/protobuf/timestamp.proto";

// FlightService хранит рейсы и резервации мест.
// Контракт описывает операции предметной области, а не строки таблиц.
service FlightService {
  rpc SearchFlights(SearchFlightsRequest) returns (SearchFlightsResponse);
  rpc GetFlight(GetFlightRequest) returns (Flight);
  rpc ReserveSeats(ReserveSeatsRequest) returns (SeatReservation);
  rpc ReleaseReservation(ReleaseReservationRequest) returns (SeatReservation);
  // Меняет цену, статус и время. Номер рейса, маршрут, дату вылета и total_seats не меняет.
  rpc UpdateFlight(UpdateFlightRequest) returns (Flight);
}

enum FlightStatus {
  FLIGHT_STATUS_UNSPECIFIED = 0;
  FLIGHT_STATUS_SCHEDULED = 1;
  FLIGHT_STATUS_DEPARTED = 2;
  FLIGHT_STATUS_CANCELLED = 3;
  FLIGHT_STATUS_COMPLETED = 4;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_ACTIVE = 1;
  RESERVATION_STATUS_RELEASED = 2;
  RESERVATION_STATUS_EXPIRED = 3;
}

message Flight {
  string id = 1;
  string flight_number = 2;
  string origin = 3;
  string destination = 4;
  google.protobuf.Timestamp departure_at = 5;
  google.protobuf.Timestamp arrival_at = 6;
  int32 total_seats = 7;
  int32 available_seats = 8;
  // Десятичная цена с двумя знаками, без двоичного округления.
  string price = 9;
  FlightStatus status = 10;
}

message SearchFlightsRequest {
  string origin = 1;
  string destination = 2;
  // Необязательная календарная дата вылета. Берётся день в UTC.
  google.protobuf.Timestamp date = 3;
}

message SearchFlightsResponse {
  repeated Flight flights = 1;
}

message GetFlightRequest {
  string id = 1;
}

message ReserveSeatsRequest {
  string flight_id = 1;
  int32 seat_count = 2;
  string booking_id = 3;
}

message ReleaseReservationRequest {
  string booking_id = 1;
}

message SeatReservation {
  string id = 1;
  string flight_id = 2;
  string booking_id = 3;
  int32 seat_count = 4;
  ReservationStatus status = 5;
}

message UpdateFlightRequest {
  string id = 1;
  string price = 2;
  FlightStatus status = 3;
  google.protobuf.Timestamp departure_at = 4;
  google.protobuf.Timestamp arrival_at = 5;
}
