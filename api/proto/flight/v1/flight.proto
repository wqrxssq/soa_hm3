syntax = "proto3";

package flight.v1;

option go_package = "flightbooking/internal/flightv1;flightv1";

import "google/protobuf/timestamp.proto";

// Любой метод может вернуть:
//   UNAUTHENTICATED — нет metadata "authorization: Bearer <jwt>" или токен недействителен;
//   INTERNAL — непредвиденная ошибка сервера.
service FlightService {
  // Рейсы в статусе SCHEDULED по маршруту и, если задана, дате вылета.
  // Ошибки:
  //   INVALID_ARGUMENT — origin или destination не код IATA, либо они совпадают.
  rpc SearchFlights(SearchFlightsRequest) returns (SearchFlightsResponse);

  // Ошибки:
  //   INVALID_ARGUMENT — id не UUID;
  //   NOT_FOUND — рейса нет.
  rpc GetFlight(GetFlightRequest) returns (Flight);

  // Атомарно списывает места и создаёт резервацию.
  // Идемпотентен по booking_id: повтор с тем же рейсом и числом мест
  // возвращает активную резервацию и не списывает места ещё раз.
  // Ошибки:
  //   INVALID_ARGUMENT — flight_id или booking_id не UUID, seat_count < 1;
  //   NOT_FOUND — рейса нет;
  //   FAILED_PRECONDITION — рейс не в статусе SCHEDULED,
  //     либо резервация с этим booking_id уже снята или просрочена;
  //   RESOURCE_EXHAUSTED — свободных мест меньше, чем seat_count;
  //   ALREADY_EXISTS — у booking_id уже есть активная резервация
  //     с другим рейсом или числом мест.
  rpc ReserveSeats(ReserveSeatsRequest) returns (SeatReservation);

  // Возвращает места и переводит резервацию в RELEASED.
  // Повторный вызов для снятой резервации возвращает её без изменений.
  // Ошибки:
  //   INVALID_ARGUMENT — booking_id не UUID;
  //   NOT_FOUND — резервации с этим booking_id нет;
  //   FAILED_PRECONDITION — резервация просрочена (EXPIRED).
  rpc ReleaseReservation(ReleaseReservationRequest) returns (SeatReservation);

  // Меняет цену, статус и время рейса в пределах той же даты вылета (UTC).
  // Ошибки:
  //   INVALID_ARGUMENT — id не UUID, цена не положительна, статус не задан,
  //     прилёт не позже вылета или вылет перенесён на другую дату;
  //   NOT_FOUND — рейса нет.
  rpc UpdateFlight(UpdateFlightRequest) returns (Flight);
}

enum FlightStatus {
  FLIGHT_STATUS_UNSPECIFIED = 0;
  FLIGHT_STATUS_SCHEDULED = 1;
  FLIGHT_STATUS_DEPARTED = 2;
  FLIGHT_STATUS_CANCELLED = 3;
  FLIGHT_STATUS_COMPLETED = 4;
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_ACTIVE = 1;
  RESERVATION_STATUS_RELEASED = 2;
  RESERVATION_STATUS_EXPIRED = 3;
}

message Flight {
  string id = 1;
  string flight_number = 2;
  string origin = 3;
  string destination = 4;
  google.protobuf.Timestamp departure_at = 5;
  google.protobuf.Timestamp arrival_at = 6;
  int32 total_seats = 7;
  int32 available_seats = 8;
  // Десятичная строка.
  string price = 9;
  FlightStatus status = 10;
}

message SearchFlightsRequest {
  string origin = 1;
  string destination = 2;
  // Календарный день в UTC.
  google.protobuf.Timestamp date = 3;
}

message SearchFlightsResponse {
  repeated Flight flights = 1;
}

message GetFlightRequest {
  string id = 1;
}

message ReserveSeatsRequest {
  string flight_id = 1;
  int32 seat_count = 2;
  string booking_id = 3;
}

message ReleaseReservationRequest {
  string booking_id = 1;
}

message SeatReservation {
  string id = 1;
  string flight_id = 2;
  string booking_id = 3;
  int32 seat_count = 4;
  ReservationStatus status = 5;
}

message UpdateFlightRequest {
  string id = 1;
  string price = 2;
  FlightStatus status = 3;
  google.protobuf.Timestamp departure_at = 4;
  google.protobuf.Timestamp arrival_at = 5;
}
